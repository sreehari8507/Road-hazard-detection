<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sky4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="waterSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#0369A1" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0.95" />
    </linearGradient>
  </defs>
  <rect width="800" height="180" fill="url(#sky4)" />
  <!-- Rain streaks in sky -->
  <line x1="120" y1="20" x2="100" y2="100" stroke="#38BDF8" stroke-width="1.5" opacity="0.3" />
  <line x1="320" y1="10" x2="300" y2="90" stroke="#38BDF8" stroke-width="1.5" opacity="0.3" />
  <line x1="560" y1="30" x2="540" y2="110" stroke="#38BDF8" stroke-width="1.5" opacity="0.3" />
  <line x1="720" y1="15" x2="700" y2="95" stroke="#38BDF8" stroke-width="1.5" opacity="0.3" />

  <!-- Road -->
  <polygon points="260,180 540,180 780,450 20,450" fill="#0F172A" />
  <line x1="400" y1="180" x2="400" y2="450" stroke="#F8FAFC" stroke-width="6" stroke-dasharray="25,25" opacity="0.3" />
  
  <!-- Standing Water Body Ponding on Highway -->
  <path d="M 160,330 Q 380,240 640,310 Q 720,380 520,410 Q 280,430 160,330 Z" fill="url(#waterSurface)" stroke="#38BDF8" stroke-width="2" />
  
  <!-- Wave ripples and light reflections -->
  <ellipse cx="380" cy="320" rx="90" ry="12" fill="none" stroke="#7DD3FC" stroke-width="1.5" opacity="0.6" />
  <ellipse cx="440" cy="350" rx="140" ry="16" fill="none" stroke="#BAE6FD" stroke-width="2" opacity="0.5" />
  <ellipse cx="330" cy="370" rx="80" ry="10" fill="none" stroke="#7DD3FC" stroke-width="1.5" opacity="0.7" />
  
  <line x1="0" y1="180" x2="800" y2="180" stroke="#00E5FF" stroke-width="1" opacity="0.25" stroke-dasharray="5,5" />
</svg>
